[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "18"
  # Set REACT_APP_NVIP_API_URL and REACT_APP_NVIP_USE_MOCKS per deploy context in
  # Netlify (Site configuration -> Environment variables), not here.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
