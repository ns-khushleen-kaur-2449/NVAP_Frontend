<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#161B2E" />
    <meta name="description" content="NVIP — Netsmartz Voice Intelligence Platform: Receptionist, Outbound, SDR, Hiring and Real Estate voice agents on one platform." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF7A1A'/%3E%3Ctext x='16' y='22' font-size='18' font-family='Arial, sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>NVIP — Netsmartz Voice Intelligence Platform</title>
    <script>
      /* Apply the saved (or OS) theme before first paint — keep the key in sync with src/context/ThemeContext.jsx. */
      (function () {
        var t = null;
        try { t = localStorage.getItem('nvip_theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run NVIP.</noscript>
    <div id="root"></div>
  </body>
</html>
